<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 88% 0%,rgba(23,111,186,.09),transparent 34rem),linear-gradient(180deg,#f9fbfd 0%,#f3f7fa 68%,#f7f9fb 100%);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;letter-spacing:.005em}button,input{font:inherit}header{position:sticky;top:0;z-index:3;min-height:72px;padding:0 clamp(18px,3.5vw,56px);display:flex;align-items:center;justify-content:space-between;gap:18px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid #e2eaf0}header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--green) 0 25%,var(--blue) 25% 50%,var(--gold) 50% 75%,var(--pink) 75% 100%)}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:750;white-space:nowrap}.brand img{width:42px;height:42px;object-fit:contain}.tag{font-size:13px;font-weight:500;color:var(--muted)}.nav{display:flex;align-items:center;gap:10px}.nav a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 13px;text-decoration:none;color:#1768a8;font-size:13px;font-weight:650;border:1px solid #dce9f2;border-radius:10px;background:#fff}.nav a:hover{background:#eff7fc;border-color:#bfd8e8}.nav a.primary{color:#fff;background:linear-gradient(135deg,#1c7cc2,#1764a4);border-color:#176fba}.wrap{max-width:1480px;margin:0 auto;padding:38px clamp(18px,3.5vw,56px) 28px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:25px;margin-bottom:25px}.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:9px;color:#176fba;font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase}.eyebrow:before{content:"";width:24px;height:2px;background:linear-gradient(90deg,var(--green),var(--blue),var(--gold),var(--pink))}h1{margin:0 0 9px;font-size:clamp(28px,3vw,38px);letter-spacing:-.035em;line-height:1.2}.intro p{max-width:720px;color:#71818a;font-size:15px;line-height:1.75}.privacy{flex:0 0 auto;padding:8px 12px;border:1px solid #d8eddf;border-radius:99px;background:#eaf6ef;color:#287653;font-size:12px}.toolbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 3px 12px rgba(25,62,87,.035)}.search{position:relative;flex:1;max-width:620px}.search:before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-55%);font-size:22px;color:#82929c;pointer-events:none}input[type=search]{width:100%;min-height:44px;padding:10px 13px 10px 39px;border:1px solid #dce6ed;border-radius:10px;background:#fff;color:var(--ink);font-size:14px;outline:none}input[type=search]:focus{border-color:#5a9bcc;box-shadow:0 0 0 3px rgba(23,111,186,.11)}.count{margin-left:auto;color:#778894;font-size:13px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch;gap:16px}.card{display:flex;min-width:0;flex-direction:column;padding:10px;text-decoration:none;color:inherit;border:1px solid #e0e8ee;border-radius:15px;background:rgba(255,255,255,.96);box-shadow:0 2px 7px rgba(27,56,77,.035);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.card:hover{transform:translateY(-2px);border-color:#a8c9df;box-shadow:0 10px 24px rgba(30,74,103,.10)}.card:focus-visible,.nav a:focus-visible{outline:3px solid rgba(23,111,186,.25);outline-offset:3px}.frame{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:.73;overflow:hidden;border-radius:9px;background:linear-gradient(145deg,#f4f7f9,#eaf0f4)}.frame img{display:block;width:100%;height:100%;object-fit:contain}.placeholder{padding:16px;text-align:center;color:#8797a2;font-size:13px;line-height:1.7}.badge{position:absolute;top:9px;left:9px;padding:5px 9px;border:1px solid #d8eddf;border-radius:99px;background:#eaf6ef;color:#287653;font-size:11px;font-weight:750}.badge.missing{border-color:#f2e4bd;background:#fff5df;color:#92651a}.badge.demo{border-color:#dce8f4;background:#eff5fb;color:#56758c}.info{min-width:0;padding:11px 3px 3px}.info strong{display:block;overflow:hidden;color:#244457;font-size:14px;line-height:1.55;text-overflow:ellipsis;white-space:nowrap}.info span{display:block;overflow:hidden;margin-top:4px;color:#7b8b95;font-size:12px;line-height:1.55;text-overflow:ellipsis;white-space:nowrap}.empty{grid-column:1/-1;display:grid;place-items:center;min-height:210px;padding:30px;border:1px dashed #d7e3eb;border-radius:15px;background:rgba(255,255,255,.7);text-align:center;color:#718391;font-size:14px;line-height:1.8}.empty strong{display:block;margin-bottom:5px;color:#35566a;font-size:16px}.error{margin:18px 0;padding:14px 16px;border:1px solid #f2e4bd;border-radius:11px;background:#fff8e9;color:#805b1c;font-size:13px;line-height:1.7}footer{padding:10px 0 0;text-align:center;color:#8a99a1;font-size:12px;line-height:1.7}.hidden{display:none!important}

.intro-actions{display:flex;flex:0 0 auto;flex-direction:column;align-items:flex-end;gap:10px}.show-button{flex:0 0 auto;min-height:44px;padding:10px 14px;border:1px solid #176fba;border-radius:10px;background:linear-gradient(135deg,#1c7cc2,#1764a4);color:#fff;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 5px 12px rgba(23,111,186,.15)}.show-button:hover{background:#10588f}.show-button:disabled{opacity:.5;cursor:not-allowed}
.slideshow{width:min(1120px,calc(100vw - 24px));max-width:none;height:94vh;height:94dvh;max-height:94vh;max-height:94dvh;padding:0;overflow:hidden;border:1px solid rgba(255,255,255,.6);border-radius:18px;background:#fff;color:var(--ink);box-shadow:0 24px 90px rgba(11,31,46,.35)}.slideshow::backdrop{background:rgba(13,35,52,.74);backdrop-filter:blur(4px)}.slide-shell{display:flex;width:100%;height:100%;max-height:94vh;max-height:94dvh;min-height:0;flex-direction:column}.slide-head{display:flex;flex:0 0 auto;align-items:flex-start;justify-content:space-between;gap:15px;padding:18px 22px;border-bottom:1px solid #e6edf1}.slide-head h2{overflow:hidden;margin:3px 0;color:#244457;font-size:18px;text-overflow:ellipsis;white-space:nowrap}.slide-head p{margin:0;color:#7b8b95;font-size:12px}.slide-close,.slide-controls button,.slide-arrow{border:1px solid #dce6ed;border-radius:10px;background:#fff;color:#29485d;font-weight:700;cursor:pointer}.slide-close{flex:0 0 auto;padding:9px 13px}.slide-stage{display:grid;flex:1 1 auto;grid-template-columns:56px minmax(0,1fr) 56px;grid-template-rows:minmax(0,1fr);align-items:center;gap:10px;min-height:0;padding:16px;background:radial-gradient(ellipse at center,#273f53,#102839)}.slide-media{display:grid;place-items:center;min-width:0;width:100%;height:100%;max-height:100%;min-height:0;overflow:hidden;border-radius:8px}.slide-media img{display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;cursor:pointer;filter:drop-shadow(0 8px 18px rgba(0,0,0,.3))}.slide-placeholder{display:grid;place-items:center;width:min(500px,100%);height:100%;padding:24px;border:1px dashed rgba(255,255,255,.3);border-radius:12px;color:#d4e1e9;text-align:center;line-height:1.8}.slide-arrow{width:48px;height:58px;padding:0;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:white;font-size:30px;line-height:1}.slide-arrow:hover{background:rgba(255,255,255,.25)}.slide-controls{display:flex;flex:0 0 auto;flex-wrap:wrap;align-items:center;justify-content:center;gap:15px;padding:14px;border-top:1px solid #e6edf1}.slide-controls button{min-height:40px;padding:8px 14px}.slide-controls button:hover,.slide-close:hover{background:#eff7fc}.slide-counter{min-width:100px;color:#71818a;font-size:13px;text-align:center}
.mode-switch{display:flex;flex:0 0 auto;gap:2px;padding:3px;border:1px solid #dce6ed;border-radius:11px;background:#f4f8fb}.mode-button{min-height:36px;padding:7px 11px;border:0;border-radius:8px;background:transparent;color:#5f7685;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}.mode-button.active{background:#fff;color:#1768a8;box-shadow:0 1px 4px rgba(23,54,77,.12)}.frame.poster-mode{aspect-ratio:16/9;background:#eaf0f4}.frame.poster-mode img{object-fit:contain}
.info .badge{position:static;display:inline-flex;margin:0 0 8px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){header{min-height:64px;padding:0 15px}.brand{gap:8px;font-size:15px}.brand img{width:36px;height:36px}.tag{display:none}.nav{gap:7px}.nav a{min-height:38px;padding:8px 10px;font-size:12px}.wrap{padding:25px 14px 20px}.intro{display:block;margin-bottom:18px}.intro p{font-size:14px}.intro-actions{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:13px}.privacy{display:inline-block}.toolbar{align-items:stretch;flex-direction:column;gap:9px;padding:12px}.search{max-width:none}.count{text-align:right;font-size:12px}.mode-switch{width:100%;margin-left:0}.mode-button{flex:1}.show-button{width:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:7px;border-radius:12px}.frame{aspect-ratio:.72}.info{padding-top:8px}.info strong{font-size:12px}.info span{font-size:11px}.slide-head{padding:14px}.slide-head h2{max-width:64vw;font-size:15px}.slide-stage{grid-template-columns:38px minmax(0,1fr) 38px;grid-template-rows:minmax(0,1fr);flex:1 1 auto;min-height:0;gap:5px;padding:9px}.slide-arrow{width:36px;height:48px;font-size:24px}.slide-media{height:100%;min-height:0}.slide-controls{gap:9px;padding:10px}.slide-counter{min-width:70px;font-size:12px}}
@media(max-width:340px){.grid{grid-template-columns:1fr}.frame{aspect-ratio:.85}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition-duration:.01ms!important}}

.skeleton-card{cursor:progress;pointer-events:none}
.skeleton-block{position:relative;display:block;overflow:hidden;background:#e9eef2}
.skeleton-block::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.72) 48%,transparent 76%);animation:skeleton-shimmer 1.55s ease-in-out infinite}
.skeleton-frame{background:#e9eef2}
.skeleton-badge{position:absolute;top:9px;left:9px;z-index:1;width:74px;height:20px;border-radius:999px;background:#dfe8ed}
.skeleton-line{height:11px;border-radius:999px}
.skeleton-title{width:72%;height:13px}

@keyframes skeleton-shimmer{to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.skeleton-block::after{animation:none;transform:none;opacity:.3}}
</style>

<header><div class="brand"><img src="./favicon.png" alt="">海報製作室 <span class="tag">／ 專題成果展</span></div><nav class="nav" aria-label="主要導覽"><a href="./index.html">回到海報製作室</a><a class="primary" href="./index.html">新增或匯入資料</a></nav></header>
<main class="wrap">
  <section class="intro"><div><div class="eyebrow">Project image library</div><h1>圖片相簿</h1><p>集中檢視每筆專題的圖片與狀態。點選任一卡片，就能回到海報製作室編輯該筆資料。</p></div><div class="intro-actions"><span class="privacy">資料只儲存在這個瀏覽器</span><button id="startShow" class="show-button" type="button" disabled>▶ 播放幻燈片</button></div></section>
  <section class="toolbar" aria-label="搜尋與檢視圖片相簿"><label class="search"><input id="search" type="search" placeholder="搜尋編號、專題名稱、班級或檔名…" aria-label="搜尋圖片相簿"></label><span id="count" class="count" aria-live="polite">讀取中…</span><div class="mode-switch" role="group" aria-label="相簿檢視方式"><button id="modeSource" class="mode-button active" type="button" aria-pressed="true">專題圖片</button><button id="modePoster" class="mode-button" type="button" aria-pressed="false">製作海報</button></div></section>

    <div class="card skeleton-card" aria-hidden="true"><span class="frame skeleton-block skeleton-frame"><span class="skeleton-block skeleton-badge"></span></span><span class="info"><span class="skeleton-block skeleton-line skeleton-title"></span><span class="skeleton-block skeleton-line skeleton-detail"></span></span></div>
    <div class="card skeleton-card" aria-hidden="true"><span class="frame skeleton-block skeleton-frame"><span class="skeleton-block skeleton-badge"></span></span><span class="info"><span class="skeleton-block skeleton-line skeleton-title"></span><span class="skeleton-block skeleton-line skeleton-detail"></span></span></div>
    <div class="card skeleton-card" aria-hidden="true"><span class="frame skeleton-block skeleton-frame"><span class="skeleton-block skeleton-badge"></span></span><span class="info"><span class="skeleton-block skeleton-line skeleton-title"></span><span class="skeleton-block skeleton-line skeleton-detail"></span></span></div>
    <div class="card skeleton-card" aria-hidden="true"><span class="frame skeleton-block skeleton-frame"><span class="skeleton-block skeleton-badge"></span></span><span class="info"><span class="skeleton-block skeleton-line skeleton-title"></span><span class="skeleton-block skeleton-line skeleton-detail"></span></span></div>
    <div class="card skeleton-card" aria-hidden="true"><span class="frame skeleton-block skeleton-frame"><span class="skeleton-block skeleton-badge"></span></span><span class="info"><span class="skeleton-block skeleton-line skeleton-title"></span><span class="skeleton-block skeleton-line skeleton-detail"></span></span></div>
    <div class="card skeleton-card" aria-hidden="true"><span class="frame skeleton-block skeleton-frame"><span class="skeleton-block skeleton-badge"></span></span><span class="info"><span class="skeleton-block skeleton-line skeleton-title"></span><span class="skeleton-block skeleton-line skeleton-detail"></span></span></div>

</main>
<dialog id="slideshow" class="slideshow" aria-labelledby="slideTitle"><div class="slide-shell"><div class="slide-head"><div><p id="slideDetail">圖片相簿</p><h2 id="slideTitle">幻燈片播放</h2></div><button id="closeShow" class="slide-close" type="button">關閉</button></div><div class="slide-stage"><button id="prevSlide" class="slide-arrow" type="button" aria-label="上一張">‹</button><div id="slideMedia" class="slide-media"></div><button id="nextSlide" class="slide-arrow" type="button" aria-label="下一張">›</button></div><div class="slide-controls"><button id="togglePlay" type="button">Ⅱ 暫停播放</button><span id="slideCounter" class="slide-counter" aria-live="polite"></span><span class="slide-counter">點圖片或用鍵盤 ← → 切換</span></div></div></dialog>
<script src="./poster-renderer.js"></script>
<script>
const DB_NAME='thematic-exhibition-poster-studio',DB_VERSION=1;
const $=id=>document.getElementById(id);
const safeText=value=>String(value??'');
let records=[],objectUrls=[],demoPreviewUrl='',templateImage=null,visibleItems=[],slideIndex=0,slideTimer=null,slideObjectUrl='',viewMode='source',posterCache=new WeakMap(),posterObserver=null,slideRenderToken=0,galleryLoading=true;
function clearObjectUrls(){for(const url of objectUrls)URL.revokeObjectURL(url);objectUrls=[]}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(Error('這個瀏覽器不支援本機儲存。'));const request=indexedDB.open(DB_NAME,DB_VERSION);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('state'))request.result.createObjectStore('state')};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||Error('無法開啟本機資料。'))})}
async function readRecords(){const db=await openDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('state','readonly'),request=tx.objectStore('state').get('app');request.onsuccess=()=>resolve(request.result?.records||[]);request.onerror=()=>reject(request.error||Error('無法讀取本機資料。'))})}finally{db.close()}}
function loadDemoPreview(){return new Promise(resolve=>{const template=new Image();template.onload=()=>{try{templateImage=template;const canvas=document.createElement('canvas');canvas.width=660;canvas.height=934;canvas.getContext('2d').drawImage(template,1224,73,660,934,0,0,660,934);demoPreviewUrl=canvas.toDataURL('image/png');resolve(true)}catch{resolve(false)}};template.onerror=()=>resolve(false);template.src='./assets/nutc-exhibition-template.png'})}
function loadBlobImage(blob){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('圖片無法讀取'))};img.src=url})}
function loadUrlImage(url){return new Promise((resolve,reject)=>{if(!url)return reject(Error('圖片不存在'));const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('圖片無法讀取'));img.src=url})}
function posterPreview(record){if(posterCache.has(record))return posterCache.get(record);const work=(async()=>{if(!templateImage)return {url:'',broken:false};let image=null,broken=false;try{if(record.imageSource==='demo'&&demoPreviewUrl)image=await loadUrlImage(demoPreviewUrl);else if(record.imageBlob)image=await loadBlobImage(record.imageBlob)}catch{broken=!!record.imageBlob}const canvas=document.createElement('canvas');canvas.width=960;canvas.height=540;renderPosterCanvas(canvas,record,templateImage,image);return {url:canvas.toDataURL('image/png'),broken}})();posterCache.set(record,work);return work}
function queuePosterPreview(img,record,badge,frame){posterPreview(record).then(result=>{if(!img.isConnected)return;if(result.broken){badge.className='badge missing';badge.textContent='圖片無法預覽'}if(result.url)img.src=result.url;else{img.remove();frame.classList.add('placeholder');frame.insertBefore(document.createTextNode('無法產生海報預覽'),badge)}}).catch(()=>{if(img.isConnected){img.remove();frame.classList.add('placeholder');frame.insertBefore(document.createTextNode('無法產生海報預覽'),badge)}})}
function observePoster(img,record,badge,frame){img._posterData={record,badge,frame};if(!('IntersectionObserver'in window)){queuePosterPreview(img,record,badge,frame);return}if(!posterObserver)posterObserver=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){posterObserver.unobserve(entry.target);const data=entry.target._posterData;queuePosterPreview(entry.target,data.record,data.badge,data.frame)}});posterObserver.observe(img)}
function appendPlaceholder(frame,text){frame.classList.add('placeholder');frame.append(document.createTextNode(text))}
function setMissing(card,frame,badge,message){badge.className='badge missing';badge.textContent='缺少圖片';frame.querySelector('img')?.remove();frame.classList.add('placeholder');frame.replaceChildren(document.createTextNode(message));card.dataset.status='缺少圖片'}
function render(){if(galleryLoading)return;clearObjectUrls();const query=$('search').value.trim().toLocaleLowerCase(),grid=$('grid');grid.setAttribute('aria-busy','false');grid.replaceChildren();const items=records.map((record,index)=>({record,index})).filter(({record})=>{const status=record.imageSource==='demo'?'範例圖片':record.imageBlob?'已加入圖片':'缺少圖片';return !query||[record.code,record.name,record.className,record.filename,record.imageLabel,status].map(safeText).join(' ').toLocaleLowerCase().includes(query)});$('count').textContent=query?`顯示 ${items.length} / ${records.length} 筆`:`共 ${records.length} 筆`;visibleItems=items;$('startShow').disabled=!items.length;
  if(!items.length){const empty=document.createElement('div');empty.className='empty';const strong=document.createElement('strong');strong.textContent=records.length?'找不到符合的圖片或專題資料':'目前沒有專題資料';const detail=document.createElement('span');detail.textContent=records.length?'試試其他關鍵字，或清除搜尋條件。':'回到海報製作室新增或匯入資料後，圖片就會顯示在這裡。';empty.append(strong,detail);grid.append(empty);return}
  for(const {record,index} of items){const card=document.createElement('a');card.className='card';card.href=`./index.html?edit=${index}`;card.setAttribute('aria-label',`編輯 ${record.code||'未填編號'} ${record.name||'未命名專題'}`);const frame=document.createElement('span');frame.className=`frame${viewMode==='poster'?' poster-mode':''}`;const badge=document.createElement('span');badge.className='badge';const hasImage=!!record.imageBlob&&record.imageSource!=='demo',isDemo=record.imageSource==='demo';
    if(viewMode==='poster'){const img=document.createElement('img');img.alt=`${record.code||'專題'} 製作完成海報預覽`;img.loading='lazy';img.decoding='async';badge.textContent=hasImage?'已製作海報':isDemo?'範例海報':'缺少圖片';badge.classList.toggle('missing',!hasImage&&!isDemo);badge.classList.toggle('demo',isDemo);frame.append(img,badge);observePoster(img,record,badge,frame)}
    else if(hasImage){const img=document.createElement('img');img.alt=`${record.code||'專題'} 海報圖片`;img.loading='lazy';img.decoding='async';try{const url=URL.createObjectURL(record.imageBlob);objectUrls.push(url);img.src=url;badge.textContent='已加入圖片';img.onerror=()=>setMissing(card,frame,badge,'圖片無法預覽')}catch{appendPlaceholder(frame,'圖片無法預覽');badge.classList.add('missing');badge.textContent='缺少圖片'}frame.append(img)}else if(isDemo&&demoPreviewUrl){const img=document.createElement('img');img.alt=`${record.code||'專題'} 範例預覽圖片`;img.loading='lazy';img.src=demoPreviewUrl;frame.append(img);badge.classList.add('demo');badge.textContent='範例圖片'}else{appendPlaceholder(frame,'尚未加入圖片');badge.classList.add('missing');badge.textContent='缺少圖片'}
    const info=document.createElement('span');info.className='info';if(viewMode==='source')info.append(badge);const title=document.createElement('strong');title.textContent=[record.code,record.name].filter(Boolean).join(' · ')||'未命名專題';title.title=title.textContent;const detail=document.createElement('span');detail.textContent=[record.className,record.imageLabel||record.filename].filter(Boolean).join(' · ')||'點選以查看與編輯';detail.title=detail.textContent;info.append(title,detail);card.append(frame,info);grid.append(card)}
}
function setViewMode(mode){viewMode=mode;$('modeSource').classList.toggle('active',mode==='source');$('modePoster').classList.toggle('active',mode==='poster');$('modeSource').setAttribute('aria-pressed',String(mode==='source'));$('modePoster').setAttribute('aria-pressed',String(mode==='poster'));$('startShow').textContent=mode==='poster'?'▶ 播放海報幻燈片':'▶ 播放幻燈片';render()}
$('modeSource').addEventListener('click',()=>setViewMode('source'));$('modePoster').addEventListener('click',()=>setViewMode('poster'));
function stopAuto(){clearInterval(slideTimer);slideTimer=null;$('togglePlay').textContent='▶ 自動播放'}
function startAuto(){stopAuto();$('togglePlay').textContent='Ⅱ 暫停播放';slideTimer=setInterval(()=>moveSlide(1),3500)}
async function paintSlide(){if(!visibleItems.length)return;const token=++slideRenderToken,{record}=visibleItems[slideIndex];$('slideTitle').textContent=[record.code,record.name].filter(Boolean).join(' · ')||'未命名專題';$('slideDetail').textContent=(viewMode==='poster'?'製作海報 · ':'')+([record.className,record.imageLabel||record.filename].filter(Boolean).join(' · ')||(record.imageSource==='demo'?'範例預覽圖片':'專題海報'));$('slideCounter').textContent=`${slideIndex+1} / ${visibleItems.length}`;const media=$('slideMedia');media.replaceChildren();if(slideObjectUrl){URL.revokeObjectURL(slideObjectUrl);slideObjectUrl=''}let src='',alt='';if(viewMode==='poster'){try{src=(await posterPreview(record)).url;alt=`${record.code||'專題'} 完整製作海報`}catch{}}else if(record.imageBlob&&record.imageSource!=='demo'){try{slideObjectUrl=URL.createObjectURL(record.imageBlob);src=slideObjectUrl;alt=`${record.code||'專題'} 海報圖片`}catch{}}else if(record.imageSource==='demo'&&demoPreviewUrl){src=demoPreviewUrl;alt='範例海報預覽'}if(token!==slideRenderToken)return;if(src){const img=document.createElement('img');img.src=src;img.alt=alt;img.title='點一下切換下一張';img.onclick=()=>moveSlide(1);img.onerror=()=>{media.replaceChildren();const placeholder=document.createElement('div');placeholder.className='slide-placeholder';placeholder.textContent='這張圖片目前無法預覽；可用左右按鈕繼續瀏覽。';media.append(placeholder)};media.append(img)}else{const placeholder=document.createElement('div');placeholder.className='slide-placeholder';placeholder.textContent=viewMode==='poster'?'無法產生海報預覽；可用左右按鈕繼續瀏覽。':record.imageSource==='demo'?'範例預覽圖片暫時無法載入':'尚未加入圖片；可用左右按鈕繼續瀏覽。';media.append(placeholder)}}
function moveSlide(delta){if(!visibleItems.length)return;slideIndex=(slideIndex+delta+visibleItems.length)%visibleItems.length;paintSlide()}
function openSlideshow(){if(!visibleItems.length)return;slideIndex=0;paintSlide();$('slideshow').showModal();startAuto()}
function closeSlideshow(){stopAuto();$('slideshow').close();if(slideObjectUrl){URL.revokeObjectURL(slideObjectUrl);slideObjectUrl=''}}
$('startShow').addEventListener('click',openSlideshow);$('closeShow').addEventListener('click',closeSlideshow);$('prevSlide').addEventListener('click',()=>moveSlide(-1));$('nextSlide').addEventListener('click',()=>moveSlide(1));$('togglePlay').addEventListener('click',()=>slideTimer?stopAuto():startAuto());$('slideshow').addEventListener('click',e=>{if(e.target===$('slideshow'))closeSlideshow()});$('slideshow').addEventListener('close',()=>{stopAuto();if(slideObjectUrl){URL.revokeObjectURL(slideObjectUrl);slideObjectUrl=''}});document.addEventListener('keydown',e=>{if(!$('slideshow').open)return;if(e.key==='ArrowLeft'){e.preventDefault();moveSlide(-1)}else if(e.key==='ArrowRight'){e.preventDefault();moveSlide(1)}else if(e.code==='Space'){e.preventDefault();slideTimer?stopAuto():startAuto()}});
$('search').addEventListener('input',render);
(async()=>{try{await loadDemoPreview();records=await readRecords();galleryLoading=false;render()}catch(error){galleryLoading=false;$('grid').setAttribute('aria-busy','false');$('grid').replaceChildren();$('count').textContent='無法讀取';$('loadError').textContent=`讀取本機資料時發生問題：${error.message||'請回到海報製作室重新開啟圖片相簿。'}`;$('loadError').classList.remove('hidden');const empty=document.createElement('div');empty.className='empty';empty.textContent='目前無法顯示圖片。請確認已在同一個瀏覽器與網站開啟海報製作室。';$('grid').append(empty)}})();
</script>
</body>
</html>
