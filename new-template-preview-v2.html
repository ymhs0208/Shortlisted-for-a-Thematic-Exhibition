<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專題成果展海報模板｜新版預覽</title>
<style>
:root {
  --navy: #0d1b2b;
  --navy-2: #12263b;
  --ink: #f5f7f5;
  --muted: #a8b8c5;
  --blue: #2c91d0;
  --green: #12b778;
  --gold: #f1b634;
  --pink: #e779a7;
}
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; }
body {
  display:grid; place-items:center; overflow:auto;
  background:#101923;
  color:var(--ink);
  font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
.poster {
  position:relative; isolation:isolate;
  width:1920px; height:1080px; overflow:hidden;
  padding:54px 62px;
  display:grid; grid-template-columns:minmax(0, 1fr) 724px; gap:104px;
  background:
    radial-gradient(ellipse at 12% 6%, rgba(44,145,208,.16), transparent 36%),
    radial-gradient(ellipse at 58% 100%, rgba(18,183,120,.055), transparent 32%),
    linear-gradient(118deg,#0d1b2b 0%,#102238 55%,#102035 100%);
}
.poster::before {
  content:""; position:absolute; z-index:-1; inset:0;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:linear-gradient(90deg,rgba(0,0,0,.52),transparent 70%);
}
.poster::after {
  content:""; position:absolute; z-index:-1; left:0; top:0; width:7px; height:100%;
  background:linear-gradient(180deg,var(--green) 0 25%,var(--blue) 25% 50%,var(--gold) 50% 75%,var(--pink) 75% 100%);
}
.left { min-width:0; height:972px; display:flex; flex-direction:column; padding:12px 0 4px 16px; }
.brand { display:flex; align-items:center; gap:19px; }
.logo-tile { width:82px; height:82px; display:grid; place-items:center; flex:0 0 auto; background:#f5f6f4; border-radius:12px; }
.logo { display:block; width:72px; height:72px; object-fit:contain; }
.brand-copy { display:flex; flex-direction:column; gap:6px; }
.school { color:#f6f7f4; font-size:26px; font-weight:800; letter-spacing:.025em; }
.unit { color:#9eafbc; font-size:17px; font-weight:550; letter-spacing:.09em; }
.eyebrow { display:flex; align-items:center; gap:14px; margin-top:97px; color:#91a7b9; font-size:17px; font-weight:700; letter-spacing:.18em; }
.eyebrow::before { content:""; width:38px; height:2px; background:var(--green); }
.eyebrow b { color:#e7edf0; font-weight:750; }
.code-row { display:flex; align-items:center; gap:17px; margin-top:25px; }
.code-label { color:#a5b5c2; font-size:18px; font-weight:650; letter-spacing:.08em; }
.code { display:inline-flex; align-items:center; justify-content:center; min-width:112px; height:55px; padding:0 17px; border:1px solid rgba(74,164,214,.72); border-radius:4px; background:rgba(34,116,168,.18); color:#8fd2f6; font-size:35px; font-weight:850; line-height:1; letter-spacing:.08em; }
.title-wrap { margin-top:35px; }
.title-label { color:#8ea1b0; font-size:18px; font-weight:650; letter-spacing:.12em; }
.title { margin:14px 0 0; max-width:960px; color:#fbfcf8; font-size:132px; font-weight:900; line-height:1.12; letter-spacing:-.045em; overflow-wrap:anywhere; text-wrap:balance; }
.accent-rule { display:flex; gap:5px; margin-top:28px; width:120px; height:5px; }
.accent-rule i { display:block; height:100%; border-radius:5px; }
.accent-rule i:nth-child(1){width:44px;background:var(--green)}
.accent-rule i:nth-child(2){width:32px;background:var(--blue)}
.accent-rule i:nth-child(3){width:20px;background:var(--gold)}
.accent-rule i:nth-child(4){width:14px;background:var(--pink)}
.class-block { margin-top:auto; width:100%; max-width:890px; padding:19px 0 0; border-top:1px solid rgba(190,208,220,.3); display:flex; align-items:center; gap:27px; }
.class-marker { width:4px; height:65px; background:var(--green); flex:0 0 auto; }
.class-copy { display:flex; flex-direction:column; gap:4px; }
.class-label { color:#9eafbc; font-size:16px; font-weight:650; letter-spacing:.16em; }
.class-name { color:#f6f8f6; font-size:50px; font-weight:800; letter-spacing:.015em; line-height:1.2; }
.art-side { display:flex; align-items:center; justify-content:center; position:relative; }
.art-side::before { content:""; position:absolute; width:660px; height:840px; right:9px; top:70px; border:1px solid rgba(126,173,204,.16); }
.poster-board { position:relative; width:700px; height:974px; padding:20px; display:flex; align-items:center; justify-content:center; background:#ece9e1; box-shadow:0 30px 74px rgba(0,0,0,.38),0 4px 15px rgba(0,0,0,.2); }
.art { display:block; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; }
.board-mark { position:absolute; right:21px; bottom:21px; height:5px; width:72px; background:linear-gradient(90deg,var(--green) 0 25%,var(--blue) 25% 50%,var(--gold) 50% 75%,var(--pink) 75%); }
@media print { html,body{width:1920px;height:1080px;background:#0d1b2b}.poster{print-color-adjust:exact;-webkit-print-color-adjust:exact} }
</style>
</head>
<body>
<main class="poster" aria-label="專題成果展海報新版預覽">
  <section class="left">
    <header class="brand">
      <div class="logo-tile"><img class="logo" src="./template-v2-assets/brand-icon.png" alt="學院標誌"></div>
      <div class="brand-copy">
        <div class="school">國立臺中科技大學</div>
        <div class="unit">資訊與流通學院　·　專題成果展</div>
      </div>
    </header>
    <div class="eyebrow"><b>THEMATIC PROJECT</b><span>／</span><span>作品展示</span></div>
    <div class="code-row"><span class="code-label">作品代碼</span><span class="code">A01</span></div>
    <section class="title-wrap">
      <div class="title-label">專題名稱</div>
      <h1 class="title">智慧步態分析</h1>
      <div class="accent-rule" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </section>
    <div class="class-block">
      <span class="class-marker" aria-hidden="true"></span>
      <div class="class-copy"><div class="class-label">展出班級</div><div class="class-name">資管四甲</div></div>
    </div>
  </section>
  <section class="art-side" aria-label="作品海報">
    <div class="poster-board">
      <img class="art" src="./template-v2-assets/sample-poster.jpg" alt="智慧步態分析作品海報示例">
      <span class="board-mark" aria-hidden="true"></span>
    </div>
  </section>
</main>
</body>
</html>
