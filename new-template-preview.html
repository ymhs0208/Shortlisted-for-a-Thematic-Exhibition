<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海報新版型預覽｜專題成果展</title>
<style>
:root{--blue:#176fba;--navy:#163a58;--green:#0cae70;--gold:#f5b323;--pink:#e97aaa;--paper:#f7fafc;--ink:#17364d;--muted:#668091}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
body{display:grid;place-items:center;background:#e8eef3;overflow:auto}
.poster{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 92% 14%,rgba(23,111,186,.07),transparent 26%),linear-gradient(112deg,#fbfdfe 0%,#f5f9fc 56%,#eef5fa 100%);display:grid;grid-template-columns:940px 760px;gap:68px;padding:74px 76px 76px}
.color-rail{position:absolute;inset:0 0 auto;height:10px;background:linear-gradient(90deg,var(--green) 0 25%,var(--blue) 25% 50%,var(--gold) 50% 75%,var(--pink) 75%)}
.orb{position:absolute;border-radius:50%;pointer-events:none}.orb.one{width:280px;height:280px;right:62px;top:-80px;background:rgba(233,122,170,.10)}.orb.two{width:180px;height:180px;right:630px;bottom:-88px;background:rgba(245,179,35,.10)}
.left{position:relative;z-index:1;display:flex;flex-direction:column;min-width:0;padding:28px 0 2px}
.brand{display:flex;align-items:center;gap:20px}.logo{width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 5px 9px rgba(23,54,77,.12))}.brand-copy{display:flex;flex-direction:column;gap:5px}.school{font-size:25px;font-weight:800;letter-spacing:.015em;color:var(--navy)}.unit{font-size:18px;font-weight:600;letter-spacing:.05em;color:#6d8594}
.kicker{display:flex;align-items:center;gap:14px;margin-top:85px;color:#36745f;font-size:19px;font-weight:800;letter-spacing:.13em}.kicker:before{content:"";width:36px;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--green),var(--blue),var(--gold),var(--pink))}
.code{display:flex;align-items:center;gap:20px;margin-top:25px}.code .label{color:#6b8493;font-size:21px;font-weight:700}.code .value{display:inline-flex;align-items:center;justify-content:center;min-width:160px;height:82px;padding:0 24px;border-radius:18px;background:#e5f2fb;color:var(--blue);font-size:64px;font-weight:850;line-height:1;letter-spacing:.045em;border:1px solid #d1e5f2}
.title-block{margin-top:48px}.title-label{font-size:23px;font-weight:750;letter-spacing:.08em;color:#668091}.title{margin:15px 0 0;max-width:900px;color:var(--navy);font-size:116px;line-height:1.16;font-weight:850;letter-spacing:-.045em;overflow-wrap:anywhere}.title-mark{width:130px;height:8px;border-radius:10px;margin-top:28px;background:linear-gradient(90deg,var(--blue) 0 52%,var(--green) 52% 74%,var(--gold) 74% 88%,var(--pink) 88%)}
.class-card{margin-top:auto;min-height:138px;width:790px;max-width:100%;display:flex;align-items:center;gap:30px;padding:23px 31px;border:1px solid #d5e5ef;border-left:12px solid var(--blue);border-radius:20px;background:linear-gradient(110deg,#fff 0%,#eef6fb 100%);box-shadow:0 14px 34px rgba(28,66,94,.08)}.class-card .caption{display:flex;flex-direction:column;gap:6px;min-width:94px;color:#688293;font-size:20px;font-weight:750;letter-spacing:.09em}.class-card .class{color:var(--navy);font-size:66px;font-weight:850;letter-spacing:-.035em;line-height:1.1}
.footer{margin-top:23px;color:#78909e;font-size:17px;font-weight:550;letter-spacing:.03em}.footer span{color:var(--green);padding:0 8px}
.right{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-height:0}.art-frame{height:930px;width:760px;padding:18px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #e5edf2;border-radius:24px;box-shadow:0 26px 66px rgba(19,55,80,.17),0 3px 12px rgba(19,55,80,.07)}.art{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;border-radius:9px;background:#f1f6f9}
@media print{html,body{width:1920px;height:1080px;background:white}.poster{box-shadow:none}}
</style>
</head>
